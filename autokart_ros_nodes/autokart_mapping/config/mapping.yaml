# Every path below is a placeholder: the node fails closed (publishes a fault status on
# /autokart_mapping/status and never claims a valid map) until algorithm_package_path is set. This
# file does not grant calibration or mount verification by itself.
autokart_mapping:
  ros__parameters:
    # Path to the checked-out autokart_perception algorithm package's "src" directory (parent of the
    # autokart_perception/ Python package), e.g.
    # "/home/mark1/Desktop/autonomous_kart/autonomy_stack_phase1/phase_01_perception/src"
    # Deliberately not hardcoded here: set per-deployment at launch time (see DEPENDENCIES.md).
    algorithm_package_path: ""
    source_mode: "SIMULATED"
    live_odom_verified: false
    cones_topic: "/autokart_mapping/cones_in"
    odom_topic: "/autokart/odom"
    map_topic: "/autokart_mapping/cones"
    status_topic: "/autokart_mapping/status"
    cone_input_max_age_s: 0.3
    input_timeout_s: 0.5

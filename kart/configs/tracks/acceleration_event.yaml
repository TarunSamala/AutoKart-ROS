# SIMULATION USE ONLY — event dimensions are configurable and not an official-rule claim.
track:
  name: acceleration_event_provisional
  type: open
  closed_loop: false
  coordinate_system: local_enu
  centreline: {representation: polyline, control_points: [[0, 0, 0], [100, 0, 0]]}
  width: {default_left_m: 2.5, default_right_m: 2.5}
  elevation: {source: centreline_z}
  banking: {default_rad: 0.0}
  surfaces: [dry_asphalt]
  kerbs: []
  run_off: {finish_m: 25}
  barriers: []
  cones: {generation: boundaries, spacing_m: 5.0}
  sectors: [{id: acceleration, start_s_m: 0, end_s_m: 75}]
  corners: []
  spawn_points: [{id: grid, s_m: 0, lateral_m: 0}]
  obstacles: []
materials:
  dry_asphalt: {friction_longitudinal: 1.0, friction_lateral: 0.95, rolling_resistance: 0.018}

# SIMULATION USE ONLY — engineering visualization preset.
schema_version: 1
name: gazebo_engineering_balanced
mode: gazebo
simulation:
  physics_backend: internal
  gazebo_role: visual_follower
  fidelity_tier: 3
features:
  sensor_suite: engineering_balanced
  vcu_enabled: true
  independent_safety_enabled: true
  rendering_enabled: true
  ros_enabled: true
  dashboard_enabled: true
  real_actuator_outputs_enabled: false
expected_performance: "RTF >= 0.5 on the qualified development workstation."
dependencies: [python3, pyyaml, ros2_humble, gazebo_classic_11]
physics_authority: internal
gazebo_role: visual_sensor_follower
vehicle_dynamics_authority: false
scheduler_mode: deterministic_offline
hardware_profile: development_workstation
rates:
  physics_hz: 1000
  vcu_hz: 1000
  independent_safety_hz: 1000
  gazebo_follow_hz: 100
  gazebo_world_step_hz: 100
  ros_output_hz: 20
rendering:
  headless: true
  software_render: false
  shadows: false
  sensor_visualization: false
  anti_aliasing: 0
sensors:
  rgb_camera:
    enabled: true
    width: 640
    height: 480
    rate_hz: 20
    processing_latency_s: 0.008
    transport_latency_s: 0.002
    queue_capacity: 4
  depth_camera:
    enabled: true
    width: 640
    height: 480
    rate_hz: 20
    processing_latency_s: 0.010
    transport_latency_s: 0.002
    queue_capacity: 4
  lidar:
    enabled: true
    samples: 540
    angular_coverage_deg: 270
    rate_hz: 15
    processing_latency_s: 0.004
    transport_latency_s: 0.002
    queue_capacity: 6
  imu:
    enabled: true
    source: internal
    rate_hz: 200
synchronization:
  maximum_state_age_s: 0.020
  maximum_follower_lag_s: 0.060
  acknowledgement_timeout_s: 5.0
ros:
  executor_threads: 1
  sensor_queue_depth: 8
  metadata_queue_depth: 512
execution: {}
recorder:
  process_isolation: true
  payload_evidence: representative
  maximum_payload_hashes_per_sensor: 16
  follower_evidence_stride: 2
  rosbag: false
  dashboard: true
performance_target:
  minimum_sustained_rtf: 0.5
  classification: REALTIME_DEGRADED

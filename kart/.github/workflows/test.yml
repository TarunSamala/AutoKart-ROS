name: test

on:
  push:
  pull_request:

jobs:
  headless-baseline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]'
      - run: ./scripts/build.sh
      - run: ./scripts/test.sh
      - run: kart-sim validate configs/karts/prototype.yaml
      - run: kart-sim run configs/scenarios/empty.yaml --output-dir /tmp/kart-sim-ci

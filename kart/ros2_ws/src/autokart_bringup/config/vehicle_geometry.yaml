# Single source of truth for kart/camera/bumper geometry. Every number below is USER-MEASURED
# (tape measure / reported), not a placeholder or simulation guess. Every consumer -- perception
# calibration, autokart_safety_bridge, autokart_planner, autokart_description/urdf, and the
# dashboard -- reads these values from here (via autokart_vehicle_geometry, the one Python loader)
# rather than holding its own copy. kart/ros2_ws/src/autokart_vehicle_geometry/test/test_vehicle_geometry.py
# fails if any consumer's literal drifts from this file.
#
# Diagonal tape measurements are cross-checks only. Runtime geometry uses the independently measured
# vertical camera height and horizontal floor distance from the camera ground projection to the
# front-most bumper plane. The derived camera_to_bumper_diagonal_m is about 1.543 m; see
# autokart_vehicle_geometry/geometry.py.
#
# schema_version: bump whenever a key below is added, removed, or changes meaning/units.
# Owner: autokart_vehicle_geometry. load_geometry() does not yet reject a mismatch itself;
# tools/validate_config_schema.py reports one read-only.
schema_version: 1
vehicle_geometry:
  camera_model: "HP60C"                         # owner: operator (nameplate)
  camera_height_m: 0.83                         # m; optical centre above ground; owner: operator tape measurement (2026-10-25)
  camera_pitch_down_deg: 18.0                    # deg; optical axis below horizontal; owner: operator physical measurement (2026-10-25)
  camera_to_front_bumper_horizontal_m: 1.30      # m; camera ground projection to front bumper; owner: operator tape measurement (2026-10-25)
  bumper_width_m: 1.016                          # m; 40 in -- the only bumper width figure; never 39 in (0.9906 m); owner: operator tape measurement
  stop_gap_from_bumper_m: 0.40                   # m; conservative commissioning gap from front bumper; owner: operator decision (2026-10-25)
  lateral_margin_m: 0.15                         # m; per-side corridor clearance margin beyond the bumper width; owner: operator decision

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-kart-simulator"
version = "0.1.0"
description = "Deterministic, headless autonomous electric go-kart simulation foundation"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=1.10,<3",
]

[project.optional-dependencies]
dashboard = [
  "aiohttp>=3.8",
]
dev = [
  "pytest>=7.0",
  "numpy>=1.23",
  "matplotlib>=3.5",
  "aiohttp>=3.8",
]

[project.scripts]
kart-sim = "kart_sim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
packages = ["kart_sim"]

; Build with PlatformIO. Use a recent Arduino-ESP32 core (v3.x / IDF 5) via the pioarduino platform.
[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Raspberry Pi Pico (RP2040) bench port -- see README.md "RP2040 (Pico) port". Uses the
; earlephilhower arduino-pico core, which is what config.h's ARDUINO_ARCH_RP2040 guards target.
; None of the output pins below are physically wired on this kart; see the [VERIFY, UNWIRED]
; comments in config.h. VCU_OUTPUT_WIRING_VERIFIED is unset here too, so it defaults to 0 and
; ARM still NAKs with code 7, exactly as on the esp32-s3 env.
[env:pico]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200

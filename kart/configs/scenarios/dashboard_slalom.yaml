# SIMULATION USE ONLY — deterministic steering/replay visualization case.
name: dashboard_slalom
kart_config: karts/prototype_dynamic.yaml
track_config: tracks/straight_split_friction.yaml
duration_s: 5.0
initial_state: {x_m: 0.0, y_m: 0.0, yaw_rad: 0.0, u_mps: 3.0}
control: {mode: vcu, vcu_rate_hz: 250.0, command_timeout_s: 0.15, clear_distance_m: 35.0}
command: {drive: 0.20, brake: 0.0, steering_rad: 0.0}
command_schedule:
  - {time_s: 0.5, steering_rad: 0.16}
  - {time_s: 1.2, steering_rad: -0.16}
  - {time_s: 2.0, steering_rad: 0.16}
  - {time_s: 2.8, steering_rad: -0.16}
  - {time_s: 3.6, steering_rad: 0.12}
  - {time_s: 4.3, steering_rad: 0.0}
